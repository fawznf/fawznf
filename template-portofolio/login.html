<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin System Access — Security Check</title>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* CSS KHUSUS HALAMAN LOGIN MONOKROM HUD */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #000000;
            font-family: var(--font-body, system-ui, -apple-system, sans-serif);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Latar Belakang Efek Grid HUD Minimalis */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 80%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            pointer-events: none;
            z-index: 1;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-hud, 6px);
            padding: 36px 30px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.02);
            transition: border-color 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-title {
            font-family: var(--font-nav, monospace);
            font-size: 1.15rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 6px 0;
            color: #ffffff;
        }

        .login-subtitle {
            font-size: 0.7rem;
            opacity: 0.5;
            font-family: monospace;
            letter-spacing: 1px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-family: var(--font-nav, monospace);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.7;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 16px;
            height: 16px;
            opacity: 0.4;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .form-input-custom {
            width: 100%;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-hud, 4px);
            color: #ffffff;
            padding: 12px 14px 12px 40px;
            font-size: 0.85rem;
            font-family: var(--font-body, inherit);
            outline: none;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        .form-input-custom:focus {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .form-input-custom:focus+.input-icon {
            opacity: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            border-radius: var(--radius-hud, 4px);
            font-family: var(--font-nav, monospace);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            margin-top: 24px;
        }

        .btn-submit:hover {
            background: #000000;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.25s ease, color 0.25s ease;
            font-family: monospace;
        }

        .back-link:hover {
            opacity: 1;
            color: #ffffff;
        }

        #loginAlert {
            display: none;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 20px;
            font-family: monospace;
            line-height: 1.4;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="login-wrapper">
        <div class="login-card">

            <!-- HEADER TANPA AVATAR KOTAK -->
            <div class="login-header">
                <h2 class="login-title">System Access</h2>
                <p class="login-subtitle">RESTRICTED AREA // AUTHENTICATION REQUIRED</p>
            </div>

            <!-- ALERT ERROR / STATUS -->
            <div id="loginAlert"></div>

            <!-- FORM LOGIN -->
            <form id="adminLoginForm" onsubmit="handleSecureLogin(event)" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="loginUsername">Username Identifier</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginUsername" class="form-input-custom" required
                            placeholder="Username admin..." autocomplete="off">
                        <i data-lucide="user" class="input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Security Passphrase</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" class="form-input-custom" required
                            placeholder="••••••••••••" autocomplete="off">
                        <i data-lucide="lock" class="input-icon"></i>
                    </div>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn-submit">
                    <i data-lucide="key-round" style="width: 16px;"></i> Authenticate
                </button>
            </form>

            <div class="login-footer">
                <a href="index.html" class="back-link">
                    <i data-lucide="arrow-left" style="width: 12px;"></i> Kembali ke Portofolio
                </a>
            </div>

        </div>
    </main>

    <!-- SCRIPT LOADER MODULAR ES6 -->
    <script src="js/script.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof window.checkExistingSession === 'function') {
                window.checkExistingSession();
            }
            if (typeof window.initIcons === 'function') {
                window.initIcons();
            } else if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>

</html>
